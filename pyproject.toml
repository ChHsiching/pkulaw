[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pkulaw"
version = "0.1.0"
description = "PKULaw case database CLI crawler"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.59.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
pkulaw = "pkulaw:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
